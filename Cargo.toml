[workspace]
members = ["crates/proxy-core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
thiserror = "2.0.21"
regex = "1.12"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
